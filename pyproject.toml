[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brother-bridge"
description = "Parse, render and print Brother P-touch (.lbx) label templates on Windows (b-PAC) and Linux/macOS (Brother QL raster, CUPS)."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "brother-bridge contributors" }]
keywords = [
    "brother",
    "label",
    "lbx",
    "p-touch",
    "ql",
    "printing",
    "b-pac",
    "raster",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.1",
    "fonttools>=4.40",
]

[project.optional-dependencies]
# Raster printing on Linux and macOS. PyPI does not accept direct URL
# references in uploaded metadata, so the index release is used here; install
# the upstream git build manually to get printers released after 0.9.4
# (see docs/user-guide.md).
brother = ["brother-ql>=0.9.4"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
all = [
    "brother-ql>=0.9.4",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Baromir19/brother"
Issues = "https://github.com/Baromir19/brother/issues"
Changelog = "https://github.com/Baromir19/brother/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Baromir19/brother/blob/main/docs/user-guide.md"

[tool.hatch.version]
path = "src/brother_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brother_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["brother_bridge"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/brother_bridge", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --tb=short -m 'not live'"
markers = [
    "unit: isolated, fast tests of a single component.",
    "integration: tests that exercise several components together.",
    "live: tests that talk to real hardware or network services (opt-in).",
]

[tool.coverage.run]
source = ["brother_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
